id: io.github.vishnudevk.Myna
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: myna-app

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --filesystem=xdg-run/pipewire-0:ro
  - --socket=pulseaudio
  - --device=dri
  - --own-name=com.canonical.Myna.Dictation
  - --talk-name=org.freedesktop.IBus
  - --talk-name=org.freedesktop.IBus.*
  - --filesystem=xdg-run/myna:create

build-options:
  env:
    PIP_DISABLE_PIP_VERSION_CHECK: '1'
    PIP_NO_INDEX: '1'

modules:
  - python3-requirements-whisper.json

  - name: myna-server
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/python3.13/site-packages
      - cp -r server/src/myna /app/lib/python3.13/site-packages/
      - install -Dm755 myna-server-cli      /app/bin/myna-server
      - install -Dm755 whisper-server       /app/bin/myna-whisper-server
      - install -Dm755 myna-download-model  /app/bin/myna-download-model
      - install -Dm755 myna-download-cuda   /app/bin/myna-download-cuda
    sources:
      - type: git
        url: https://github.com/canonical/myna.git
        commit: bc2eaff061062efcb296318f2efee84dc8ba4f19
      - type: file
        path: scripts/myna-server-cli
      - type: file
        path: scripts/whisper-server
      - type: file
        path: scripts/myna-download-model
      - type: file
        path: scripts/myna-download-cuda

  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
      - -Dsmoke-tests=false
      - -Dintrospection=false
      - -Dvapi=false
    sources:
      - type: archive
        url: https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.tar.gz
        sha256: 1ebb01ab14e98afd1727f68f64981c37bd23305b1f131f5667c02b94cf593192

  - name: myna
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      env:
        CARGO_HOME: /run/build/myna/cargo
        RUST_BACKTRACE: '1'
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
        SPA_PLUGIN_DIR: /usr/lib/x86_64-linux-gnu/spa-0.2
        PIPEWIRE_MODULE_DIR: /usr/lib/x86_64-linux-gnu/pipewire-0.3
    build-commands:
      - cargo build --release --locked --manifest-path client/Cargo.toml -p myna-desktop -p myna-cli -p myna-hud -p myna-config
      - install -Dm755 client/target/release/myna-desktop   /app/bin/myna-desktop
      - install -Dm755 client/target/release/myna-testbed   /app/bin/myna-testbed
      - install -Dm755 client/target/release/myna-hud       /app/bin/myna-hud
      - install -Dm755 client/target/release/myna-config    /app/bin/myna-config
      - install -Dm755 client/target/release/myna-hud-host /app/bin/myna-hud-host
      - strip --strip-debug /app/bin/myna-desktop /app/bin/myna-testbed /app/bin/myna-hud /app/bin/myna-config /app/bin/myna-hud-host
      - install -Dm644 client/data/glib-2.0/schemas/com.canonical.Myna.Dictation.gschema.xml /app/share/glib-2.0/schemas/com.canonical.Myna.Dictation.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas
      - |
        for po in client/myna-desktop/po/*.po client/myna-orchestrator/po/*.po; do
          [ -f "$po" ] || continue
          lang=$(basename "$po" .po)
          domain=$(basename "$(dirname "$(dirname "$po")")")
          mkdir -p "/app/share/locale/$lang/LC_MESSAGES"
          msgfmt "$po" -o "/app/share/locale/$lang/LC_MESSAGES/$domain.mo"
        done
      - install -Dm644 client/data/icons/hicolor/scalable/apps/com.canonical.Myna.svg /app/share/icons/hicolor/scalable/apps/io.github.vishnudevk.Myna.svg
      - install -Dm644 client/data/icons/hicolor/scalable/apps/com.canonical.Myna.Config.svg /app/share/icons/hicolor/scalable/apps/io.github.vishnudevk.Myna.Config.svg
    sources:
      - type: git
        url: https://github.com/canonical/myna.git
        commit: bc2eaff061062efcb296318f2efee84dc8ba4f19
      - type: patch
        path: patches/0001-flatpak-backend-support.patch
      - type: patch
        path: patches/0002-shortcut-desktop-steps.patch
      - type: patch
        path: patches/0003-flatpak-ibus-pid-check.patch
      - type: patch
        path: patches/0004-nvidia-ui-progress.patch
      - type: patch
        path: patches/0005-background-portal.patch
      - type: patch
        path: patches/0006-server-process-name.patch
      - type: patch
        path: patches/0007-flatpak-background-app-id.patch
      - type: file
        path: data/cargo-config.toml
        dest: .cargo
        dest-filename: config.toml
      - type: file
        path: data/version
        dest: client
        dest-filename: .version
      - cargo-sources.json

  - name: myna-packaging
    buildsystem: simple
    build-commands:
      - install -Dm755 myna-app             /app/bin/myna-app
      - install -Dm755 myna-daemon          /app/bin/myna-daemon
      - install -Dm755 myna-status          /app/bin/myna-status
      - install -Dm755 myna-toggle          /app/bin/myna-toggle
      - install -Dm755 myna-testbed-wrapper /app/bin/myna-testbed-wrapper
      - install -Dm644 io.github.vishnudevk.Myna.desktop /app/share/applications/io.github.vishnudevk.Myna.desktop
      - install -Dm644 io.github.vishnudevk.Myna.metainfo.xml /app/share/metainfo/io.github.vishnudevk.Myna.metainfo.xml
      - install -Dm644 io.github.vishnudevk.Myna.service /app/share/systemd/user/io.github.vishnudevk.Myna.service
    sources:
      - type: file
        path: scripts/myna-app
      - type: file
        path: scripts/myna-daemon
      - type: file
        path: scripts/myna-status
      - type: file
        path: scripts/myna-toggle
      - type: file
        path: scripts/myna-testbed-wrapper
      - type: file
        path: io.github.vishnudevk.Myna.desktop
      - type: file
        path: io.github.vishnudevk.Myna.metainfo.xml
      - type: file
        path: services/io.github.vishnudevk.Myna.service
