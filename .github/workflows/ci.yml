name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: Cargo tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Podman
        run: |
          command -v podman
          podman --version

      - name: Run Cargo tests
        run: scripts/container-cargo-test.sh

  container-test:
    name: Container checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Podman
        run: |
          command -v podman
          podman --version

      - name: Run repository checks
        run: scripts/container-test.sh
