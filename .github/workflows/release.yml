name: Release Flatpak

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: Cargo tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Podman
        run: |
          command -v podman
          podman --version

      - name: Run Cargo tests
        run: scripts/container-cargo-test.sh

  build:
    name: Podman Flatpak build
    needs: cargo-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Podman
        run: |
          command -v podman
          podman --version

      - name: Run container tests
        run: scripts/container-test.sh

      - name: Build Flatpak
        run: scripts/container-build.sh

      - name: Create installable bundle
        run: scripts/container-bundle.sh

      - name: Upload Flatpak bundle and checksums
        uses: actions/upload-artifact@v4
        with:
          name: myna-flatpak
          path: |
            dist/io.github.vishnudevk.Myna.flatpak
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Flatpak integration tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Podman
        run: |
          command -v podman
          podman --version

      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: myna-flatpak
          path: dist

      - name: Run Flatpak integration tests
        run: scripts/container-integration.sh

  publish-release:
    name: Publish GitHub Release
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: myna-flatpak
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/io.github.vishnudevk.Myna.flatpak
            dist/SHA256SUMS
          generate_release_notes: true
